name: Nuitka Build from Python

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: '入口脚本文件名 (例如: main.py, app.py)'
        required: true
        default: 'main.py'
        type: string
      os_selector:
        description: '选择构建操作系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      build_mode:
        description: 'Nuitka 构建模式'
        required: true
        default: 'onefile'
        type: choice
        options:
          - onefile
          - standalone
      enable_plugins:
        description: '启用的插件 (逗号分隔, 如: pyside6,tk-inter)'
        required: false
        default: ''
        type: string
      extra_options:
        description: '额外的 Nuitka 参数 (如: --windows-console-mode=disable --windows-icon-from-ico=icon.ico)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ${{ github.event.inputs.os_selector }}
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
        }
        # 安装 Nuitka（如果需要最新版可以指定版本或分支）
        pip install nuitka
        # 如果需要最新开发版：pip install https://github.com/Nuitka/Nuitka/archive/develop.zip

    - name: Build with Nuitka (Manual Command)
      id: build
      run: |
        # 获取脚本基础名（不含扩展名）
        $scriptBase = [System.IO.Path]::GetFileNameWithoutExtension("${{ github.event.inputs.script_name }}")
        echo "脚本基础名: $scriptBase"
        echo "script_base=$scriptBase" >> $env:GITHUB_OUTPUT
    
        # 构建 Nuitka 命令
        $cmd = "python -m nuitka"
    
        # 构建模式：--onefile 或 --standalone
        if ("${{ github.event.inputs.build_mode }}" -eq "onefile") {
            $cmd += " --onefile"
        } else {
            $cmd += " --standalone"
        }
    
        # 启用插件（如果有）
        $plugins = "${{ github.event.inputs.enable_plugins }}"
        if ($plugins -ne "") {
            $pluginList = $plugins -split ","
            foreach ($plugin in $pluginList) {
                $cmd += " --enable-plugin=$plugin"
            }
        }
    
        # 输出目录
        $cmd += " --output-dir=dist"
    
        # 额外的用户参数
        $extra = "${{ github.event.inputs.extra_options }}"
        if ($extra -ne "") {
            $cmd += " $extra"
        }
    
        # 最后加上脚本名
        $cmd += " ${{ github.event.inputs.script_name }}"
    
        # 打印最终命令（方便调试）
        Write-Host "执行命令: $cmd"
        Write-Host "================================"
    
        # 执行命令
        Invoke-Expression $cmd
    
        # 检查构建结果
        if ($LASTEXITCODE -ne 0) {
            Write-Host "构建失败！"
            exit $LASTEXITCODE
        }
    
        Write-Host "构建成功！"

    - name: Debug - List generated files (on failure)
      if: failure()
      run: |
        Write-Host "=== 当前目录结构 ==="
        Get-ChildItem -Recurse | Select-Object FullName, Length
        Write-Host "=== 搜索可执行文件 ==="
        Get-ChildItem -Recurse -Include @("*.exe", "*.bin", "*.app", "*.so", "*.dylib") | Select-Object FullName

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ github.event.inputs.os_selector }}-${{ github.event.inputs.build_mode }}
        path: |
          dist/
        if-no-files-found: error
