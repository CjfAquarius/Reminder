name: Build with Nuitka

on:
  workflow_dispatch:  # 允许手动点按钮触发打包

jobs:
  build:
    runs-on: windows-latest  # 必须在 Windows 环境打包

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install nuitka plyer
        # 如果你用了其他包，也在这加上 pip install

    - name: Nuitka Build (Onefile with attached exe)
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: '4.1.3'
        script-name: main.pyw
        # 输出单个 EXE
        mode: onefile
        # 隐藏 CMD 黑框
        windows-console-mode: disable
        include-package-data: 'plyer'
        enable-plugins: 'tk-inter'
        lto: 'yes'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Scheduler_Installer
        path: ./build/main.exe
