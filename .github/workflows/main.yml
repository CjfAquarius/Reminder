name: Nuitka Build from Python

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: '入口脚本文件名 (例如: main.py, app.py)'
        required: true
        default: 'main.py'
        type: string
      os_selector:
        description: '选择构建操作系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      build_mode:
        description: 'Nuitka 构建模式'
        required: true
        default: 'onefile'
        type: choice
        options:
          - onefile
          - standalone
      enable_plugins:
        description: '启用的插件 (逗号分隔, 如: pyside6,tk-inter)'
        required: false
        default: ''
        type: string
      extra_options:
        description: '额外的 Nuitka 参数 (如: --windows-console-mode=disable)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ${{ github.event.inputs.os_selector }}
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
        }
        # 如果有额外依赖可以在这里安装
        # pip install pillow pyside6

    - name: Build with Nuitka
      id: build
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: ${{ github.event.inputs.script_name }}
        mode: ${{ github.event.inputs.build_mode }}
        # 启用插件（如果有）
        enable-plugins: ${{ github.event.inputs.enable_plugins }}
        # 包含包数据（很多库需要，如 pillow、pygame）
        include-package-data: true
        # 输出目录统一到 dist，方便收集
        output-dir: dist
        # 额外参数透传（例如禁用控制台、设定图标等）
        extra-args: ${{ github.event.inputs.extra_options }}

    # 重要：获取生成的可执行文件的实际名称（不含扩展名）
    - name: Get executable name
      id: get_exe
      shell: pwsh
      run: |
        $scriptBase = [System.IO.Path]::GetFileNameWithoutExtension("${{ github.event.inputs.script_name }}")
        echo "exe_base=$scriptBase" >> $env:GITHUB_OUTPUT
        echo "可执行文件基础名: $scriptBase"

    - name: Debug - Show build directory (on failure)
      if: failure()
      run: |
        Write-Host "=== Build directory tree ==="
        Get-ChildItem -Recurse build/ | Select-Object FullName
        Write-Host "=== Dist directory tree ==="
        Get-ChildItem -Recurse dist/ | Select-Object FullName
        Write-Host "=== Searching for executables ==="
        Get-ChildItem -Recurse -Include @("*.exe", "*.bin", "*.app", "*.so") | Select-Object FullName

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ github.event.inputs.os_selector }}-${{ github.event.inputs.build_mode }}
        # 根据实际平台和模式智能匹配文件
        path: |
          dist/
          !dist/**/*.py  # 排除源码（如果不想上传）
        if-no-files-found: error
