name: Build Schedule Editor

on:
  workflow_dispatch:  # 允许手动点按钮触发打包

jobs:
  build:
    runs-on: windows-latest  # 必须在 Windows 环境打包

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'  # 缓存 pip 依赖

    - name: Install dependencies
      run: |
        pip install nuitka

    - name: Cache Nuitka build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ./build
          ./dist
          ~/.cache/nuitka
          %LOCALAPPDATA%\nuitka
          %TEMP%\nuitka
        key: ${{ runner.os }}-nuitka-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nuitka-

    - name: Nuitka Build (Onefile with attached exe)
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: '4.1.3'
        script-name: se.py
        mode: onefile
        windows-console-mode: force
        lto: 'yes'
        windows-icon-from-ico: './se.ico'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Scheduler_Installer
        path: ./build/se.exe
